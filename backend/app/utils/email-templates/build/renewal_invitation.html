<!doctype html>
<html>
  <head>
    <title>{{ project_name }} - Renewal Invitation</title>
    <style>
      body { font-family: Arial, sans-serif; background-color: #fafbfc; padding: 20px; }
      .container { background-color: #ffffff; padding: 40px; max-width: 600px; margin: 0 auto; border-radius: 8px; }
      .header { font-size: 20px; color: #333; text-align: center; margin-bottom: 30px; }
      .content { font-size: 16px; color: #555; line-height: 1.5; text-align: center; }
      .button { display: inline-block; background-color: #009688; color: #ffffff; padding: 15px 30px; text-decoration: none; border-radius: 8px; margin-top: 20px; }
      .footer { font-size: 12px; color: #999; text-align: center; margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">{{ project_name }} - Renewal Invitation</div>
      <div class="content">
        <p>Dear {{ client_name }},</p>
        <p>Your policy <strong>{{ policy_number }}</strong> is due for renewal on <strong>{{ expiry_date }}</strong>.</p>
        <p>The proposed renewal premium is <strong>KES {{ premium }}</strong>.</p>
        <a href="{{ link }}" class="button">Review & Renew</a>
      </div>
      <div class="footer">
        If you have any questions, please contact our team.
      </div>
    </div>
  </body>
</html>
